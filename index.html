<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="module" crossorigin src="/js_w6/assets/index-d2ea5JoE.js"></script>
    <link rel="stylesheet" crossorigin href="/js_w6/assets/index-BdqE0zXE.css">
  </head>
  <body>
    <section class="addTicket-panel">
      <div class="addTicket-img">
        <img
          src="https://github.com/hexschool/2022-web-layout-training/blob/main/js_week5/main_img.png?raw=true"
          alt=""
        />
        <img
          src="https://github.com/hexschool/2022-web-layout-training/blob/main/js_week5/logo.png?raw=true"
          alt=""
        />
      </div>
      <form action="" class="addTicket-form" id="newTicketForm">
        <h1 class="title">
          <span><i class="fas fa-plus-circle"></i></span>新增旅遊套票
        </h1>
        <div class="form-group">
          <div class="addTicket-input">
            <label for="ticketName">套票名稱</label>
            <input
              type="text"
              id="ticketName"
              placeholder="請填寫套票名稱"
              name="套票名稱"
              property="name"
              required
              maxlength="12"
            />
          </div>
          <div class="alert-message">
            <p
              id="ticketName-message"
              data-message="套票名稱"
              style="display: none"
            >
              <i class="fas fa-exclamation-circle"></i>
              <span>必填，長度小於12</span>
            </p>
          </div>
        </div>
        <div class="form-group">
          <div class="addTicket-input">
            <label for="ticketImgUrl">圖片網址</label>
            <input
              type="text"
              id="ticketImgUrl"
              placeholder="請填寫圖片網址"
              name="圖片網址"
              property="imgUrl"
              required
            />
          </div>
          <div class="alert-message">
            <p
              id="ticketImgUrl-message"
              data-message="圖片網址"
              style="display: none"
            >
              <i class="fas fa-exclamation-circle"></i>
              <span>必填!</span>
            </p>
          </div>
        </div>
        <div class="form-group">
          <div class="addTicket-input">
            <label for="ticketRegion">景點地區</label>
            <select id="ticketRegion" name="景點地區" required property="area">
              <!-- replace by js here  -->
            </select>
          </div>
          <div class="alert-message">
            <p
              id="ticketRegion-message"
              data-message="景點地區"
              style="display: none"
            >
              <i class="fas fa-exclamation-circle"></i>
              <span>必選!</span>
            </p>
          </div>
        </div>
        <div class="form-group">
          <div class="addTicket-input">
            <label for="ticketPrice">套票金額</label>
            <input
              type="number"
              id="ticketPrice"
              placeholder="請填寫套票金額"
              name="套票金額"
              property="price"
              required
              min="0"
            />
          </div>
          <div class="alert-message">
            <p
              id="ticketPrice-message"
              data-message="套票金額"
              style="display: none"
            >
              <i class="fas fa-exclamation-circle"></i>
              <span>必選！</span>
            </p>
          </div>
        </div>
        <div class="form-group">
          <div class="addTicket-input">
            <label for="ticketNum">套票組數</label>
            <input
              type="number"
              id="ticketNum"
              placeholder="請填寫套票組數"
              name="套票組數"
              property="group"
              required
              min="1"
            />
          </div>
          <div class="alert-message">
            <p
              id="ticketNum-message"
              data-message="套票組數"
              style="display: none"
            >
              <i class="fas fa-exclamation-circle"></i>
              <span>必選，最少1套!</span>
            </p>
          </div>
        </div>
        <div class="form-group">
          <div class="addTicket-input">
            <label for="ticketRate">套票星級</label>
            <input
              type="number"
              id="ticketRate"
              placeholder="請填寫套票星級"
              name="套票星級"
              property="rate"
              required
              min="1"
              max="10"
            />
          </div>
          <div class="alert-message">
            <p
              id="ticketRate-message"
              data-message="套票星級"
              style="display: none"
            >
              <i class="fas fa-exclamation-circle"></i>
              <span>必選，星級：1~10</span>
            </p>
          </div>
        </div>
        <div class="form-group">
          <div class="addTicket-input">
            <label for="ticketDescription">套票描述</label>
            <textarea
              name="套票描述"
              property="description"
              id="ticketDescription"
              placeholder="請填寫套票描述 (限 100 字)"
              required
              maxlength="100"
            ></textarea>
          </div>
          <div class="alert-message">
            <p
              id="ticketDescription-message"
              data-message="套票描述"
              style="display: none"
            >
              <i class="fas fa-exclamation-circle"></i>
              <span>必填、套票描述 (限 100 字)</span>
            </p>
          </div>
        </div>
        <input
          type="button"
          class="addTicket-btn btn"
          value="新增套票"
          id="addNewCard"
        />
      </form>
    </section>
    <section class="main-content">
      <div class="load-ticket-area">
        <button class="addTicket-btn btn" id="loadLV1">Load LV1 Tickets</button>
        <button class="addTicket-btn btn" id="loadLV2">Load LV2 Tickets</button>
      </div>
      <!-- 搜尋區 -->
      <div class="search-area">
        <select name="" class="regionSearch" id="searchByArea">
          <!-- replace by js here  -->
        </select>
        <p id="searchResult-text"></p>
      </div>
      <!-- 套票卡片區 -->
      <ul class="ticketCard-area" id="ticketCards">
        <!-- replace by js here  -->
      </ul>
      <!-- 查無關鍵字區 -->
      <div class="cantFind-area" id="cantFind-area">
        <h3>查無此關鍵字資料</h3>
        <img
          src="https://github.com/hexschool/2022-web-layout-training/blob/main/js_week5/no_found.png?raw=true"
          alt=""
        />
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </body>
</html>
